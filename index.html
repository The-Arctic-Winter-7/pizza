<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Stylesheet -->
        <link rel="Stylesheet" href="styles/pizza-styles.css">

        <!-- Favicon -->
        <link rel="icon" href="images/pizza-favicon.png">

        <title>Winter's Pizza</title>

    </head>
    <body>
        <div id="main">
            <div id="header">
                <img src="images/pizza-logo.png" alt="A man holding a box of pizza.">
                <h1>Welcome to Winter's Pizza!</h1>
                <h2>Serving GRC students for 50 years!</h2>
                <hr>
                <p>We make the best pizza ever! Visit us today!</p>
                <a id="contact-button" href="#" role="button">Contact Us</a>
            </div>
            <form id="pizza-form" action="#" method="get">      
                <!-- Contact Info -->
                <fieldset>
                    <legend>Contact Info</legend>
                    <!-- First Name -->
                    <label for="first-name">First Name:</label>
                    <input type="text" id="first-name" name="first-name">

                    <!-- Last Name -->
                    <label for="last-name">Last Name:</label>
                    <input type="text" id="last-name" name="last-name">

                    <!-- Email Address -->
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email">
                </fieldset>

                <!-- Select Pickup or Delivery -->
                <fieldset>
                    <legend>Select Pickup or Delivery</legend>
                    <label for="pickup">
                        <input type="radio" id="pickup" name="method" value="pickup">
                        Pickup
                    </label>
                    <label for="delivery">
                        <input type="radio" id="delivery" name="method" value="delivery">
                        Delivery
                    </label>
                </fieldset>

                <!-- Select Toppings -->
                 <fieldset>
                    <legend>Select Toppings</legend>
                </fieldset>
                <!-- Order Button -->
                 <button type="submit" id="order-button">Place Order</button>
            </form>
        </div>
    </body>
</html>
